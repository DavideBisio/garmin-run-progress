# Training rules shared by the planner (generic, committed). Personal values go in
# garmin_export/profile.toml.

[paces]
# Daniels training paces: solve VO2(v) = f * VDOT for the speed v (m/min), with
# VO2(v) = -4.60 + 0.182258 v + 0.000104 v^2. The fractions were calibrated against the
# published tables in Daniels' Running Formula for VDOT 30/40/50/60 (fixture:
# tests/fixtures/daniels_paces.json): T lands within 0.5 s/km and I within 1.2 s/km of the
# tables, E inside the published E range. M is not a fraction: it is the predicted marathon race pace.
E = 0.69
T = 0.88
I = 0.975
# R pace is I pace minus this many seconds per 400 m
R_faster_per_400_s = 6
