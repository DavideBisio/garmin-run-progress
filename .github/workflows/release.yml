# Pushing a v* tag (make release VERSION=v1.0.0) builds, tests and publishes a
# GitHub Release with garmin_grab.py and index.html attached.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: make test
      - run: >-
          gh release create "$GITHUB_REF_NAME" dist/garmin_grab.py dist/index.html
          --title "$GITHUB_REF_NAME" --generate-notes
          --notes "Open the app at https://davidebisio.github.io/garmin-run-progress/app/ or download index.html below and open it from disk. Project site and docs: https://davidebisio.github.io/garmin-run-progress/"
        env:
          GH_TOKEN: ${{ github.token }}
