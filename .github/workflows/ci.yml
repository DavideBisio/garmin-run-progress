# Test every push and pull request: the grabber and page tests, then a project site build
# so a broken site shows up on a branch before main deploys it (pages.yml deploys).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: make test
      - run: npm --prefix site ci && make site-build site-test
